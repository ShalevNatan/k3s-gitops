apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observalab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod

      - job_name: 'onprem-static'
        static_configs:
          - targets: ['10.0.0.5:9100']